<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missão Matemática</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#d9c7ff;
    overflow:hidden;
}

.tela{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    border:12px solid #6a1b9a;
    background:
    radial-gradient(circle at top left, #ffd2ef 0%, transparent 20%),
    radial-gradient(circle at bottom right, #b8d7ff 0%, transparent 20%),
    #d9c7ff;
    position:relative;
}

h1{
    font-size:65px;
    color:#6a1b9a;
    margin-bottom:30px;
    text-shadow:3px 3px white;
    text-align:center;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:15px;
    background:#8c63d6;
    color:white;
    font-size:24px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px #5c3491;
}

button:hover{
    transform:scale(1.05);
}

.autoras{
    position:absolute;
    bottom:20px;
    text-align:center;
    color:#5a2f85;
    font-size:20px;
}

#jogo{
    display:none;
    text-align:center;
    padding:20px;
}

.topo{
    width:100%;
    display:flex;
    justify-content:space-around;
    margin-bottom:20px;
    font-size:28px;
    font-weight:bold;
    color:#5a2f85;
}

.questao{
    font-size:65px;
    margin:20px;
    font-weight:bold;
}

.rosa{
    color:#ff4fb7;
}

.azul{
    color:#3c7cff;
}

.macas{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
    min-height:120px;
    width:80%;
}

.maca{
    font-size:42px;
}

input{
    width:180px;
    padding:15px;
    font-size:28px;
    text-align:center;
    border-radius:12px;
    border:3px solid #8c63d6;
    outline:none;
}

.mensagem{
    margin-top:25px;
    width:80%;
    min-height:120px;
    background:#f5ebff;
    border-radius:15px;
    padding:15px;
    font-size:24px;
    color:#5a2f85;
}

.sucesso{
    color:#1e8f3f;
    font-weight:bold;
}

.erro{
    color:#d63384;
    font-weight:bold;
}

#final{
    display:none;
    text-align:center;
}

#final h2{
    font-size:60px;
    color:#6a1b9a;
    margin-bottom:20px;
}

#final p{
    font-size:32px;
    color:#5a2f85;
    margin-bottom:20px;
}

.confete{
    position:absolute;
    width:12px;
    height:12px;
    top:-20px;
    animation:cair linear forwards;
}

@keyframes cair{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

</style>
</head>

<body>

<!-- TELA INICIAL -->

<div class="tela" id="inicio">

    <h1>Missão Matemática</h1>

    <button onclick="iniciarJogo()">Jogar</button>

    <div class="autoras">
        <p>Autoras do jogo:</p>
        <strong>Isadora Batista e Beatriz Fagundes</strong>
    </div>

</div>

<!-- TELA DO JOGO -->

<div class="tela" id="jogo">

    <div class="topo">
        <div id="fase">Fase 1</div>
        <div id="pontos">⭐ Pontos: 0</div>
        <div id="tentativas">Tentativas: 2</div>
    </div>

    <div class="questao" id="conta"></div>

    <div class="macas" id="macas"></div>

    <input type="number" id="resposta" placeholder="Resposta">

    <br><br>

    <button id="botao" onclick="acaoBotao()">Responder</button>

    <div class="mensagem" id="mensagem"></div>

</div>

<!-- TELA FINAL -->

<div class="tela" id="final">

    <h2>🎉 Parabéns! 🎉</h2>

    <p>Você concluiu todas as fases!</p>

    <p id="pontuacaoFinal"></p>

    <button onclick="location.reload()">Jogar Novamente</button>

</div>

<script>

const fases = [

[
{a:5,b:2,op:"-"},
{a:4,b:1,op:"-"},
{a:3,b:2,op:"+"}
],

[
{a:8,b:3,op:"-"},
{a:10,b:4,op:"-"},
{a:6,b:5,op:"+"}
],

[
{a:12,b:5,op:"-"},
{a:15,b:6,op:"-"},
{a:9,b:7,op:"+"}
],

[
{a:18,b:9,op:"-"},
{a:20,b:8,op:"-"},
{a:14,b:9,op:"+"}
],

[
{a:25,b:12,op:"-"},
{a:30,b:15,op:"-"},
{a:18,b:11,op:"+"}
]

];

let faseAtual = 0;
let questaoAtual = 0;
let pontos = 0;
let tentativas = 2;
let modoContinuar = false;

function iniciarJogo(){

    document.getElementById("inicio").style.display = "none";
    document.getElementById("jogo").style.display = "flex";

    carregarQuestao();
}

function carregarQuestao(){

    tentativas = 2;
    modoContinuar = false;

    document.getElementById("botao").innerText = "Responder";

    document.getElementById("tentativas").innerText =
    "Tentativas: " + tentativas;

    document.getElementById("mensagem").innerHTML = "";

    document.getElementById("resposta").value = "";

    const q = fases[faseAtual][questaoAtual];

    let cor = (questaoAtual % 2 == 0) ? "rosa" : "azul";

    let conta = document.getElementById("conta");

    conta.className = "questao " + cor;

    conta.innerHTML = `${q.a} ${q.op} ${q.b} = ?`;

    document.getElementById("fase").innerText =
    "Fase " + (faseAtual + 1);

    desenharMacas(q);
}

function desenharMacas(q){

    let div = document.getElementById("macas");

    div.innerHTML = "";

    if(q.op == "+"){

        for(let i=0; i<q.a; i++){

            let maca = document.createElement("div");

            maca.className = "maca";

            maca.innerHTML = "🍎";

            div.appendChild(maca);
        }

        let sinal = document.createElement("div");

        sinal.innerHTML = "<strong style='font-size:40px;'>+</strong>";

        div.appendChild(sinal);

        for(let i=0; i<q.b; i++){

            let maca = document.createElement("div");

            maca.className = "maca";

            maca.innerHTML = "🍎";

            div.appendChild(maca);
        }

    }else{

        for(let i=0; i<q.a; i++){

            let maca = document.createElement("div");

            maca.className = "maca";

            maca.innerHTML = "🍎";

            if(i >= q.a - q.b){
                maca.style.opacity = "0.3";
            }

            div.appendChild(maca);
        }

    }

}

function acaoBotao(){

    if(modoContinuar){
        proximaQuestao();
    }else{
        verificarResposta();
    }
}

function verificarResposta(){

    const q = fases[faseAtual][questaoAtual];

    let correta;

    if(q.op == "+"){
        correta = q.a + q.b;
    }else{
        correta = q.a - q.b;
    }

    let resposta = Number(document.getElementById("resposta").value);

    let mensagem = document.getElementById("mensagem");

    if(resposta == correta){

        pontos += 5;

        document.getElementById("pontos").innerHTML =
        "⭐ Pontos: " + pontos;

        mensagem.innerHTML =
        "<div class='sucesso'>🎉 Parabéns! Você acertou!</div>";

        chuvaConfete();

        modoContinuar = true;

        document.getElementById("botao").innerText =
        "Continuar";

    }else{

        tentativas--;

        document.getElementById("tentativas").innerText =
        "Tentativas: " + tentativas;

        if(tentativas > 0){

            mensagem.innerHTML =
            `<div class='erro'>
            ❌ Resposta incorreta.<br><br>
            Tente novamente observando as maçãs.<br>
            Você ainda possui mais uma tentativa.
            </div>`;

        }else{

            let explicacao = "";

            if(q.op == "-"){

                explicacao =
                `Na subtração retiramos ${q.b} maçãs de ${q.a}.<br>
                Por isso sobraram <strong>${correta}</strong> maçãs.`;

            }else{

                explicacao =
                `Na adição juntamos ${q.a} maçãs com ${q.b} maçãs.<br>
                Assim temos <strong>${correta}</strong> maçãs ao todo.`;
            }

            mensagem.innerHTML =
            `<div class='erro'>
            ❌ Você usou as duas tentativas.<br><br>
            ${explicacao}
            </div>`;

            modoContinuar = true;

            document.getElementById("botao").innerText =
            "Continuar";
        }

    }

}

function proximaQuestao(){

    questaoAtual++;

    if(questaoAtual >= 3){

        questaoAtual = 0;

        faseAtual++;
    }

    if(faseAtual >= 5){

        document.getElementById("jogo").style.display = "none";

        document.getElementById("final").style.display = "flex";

        document.getElementById("pontuacaoFinal").innerHTML =
        "Pontuação Final: " + pontos + " pontos";

        chuvaConfete(120);

        return;
    }

    carregarQuestao();
}

function chuvaConfete(qtd = 45){

    const cores = [
    "#ff66c4",
    "#6b7cff",
    "#ffffff",
    "#b28cff"
    ];

    for(let i=0; i<qtd; i++){

        let confete = document.createElement("div");

        confete.className = "confete";

        confete.style.left = Math.random() * 100 + "vw";

        confete.style.background =
        cores[Math.floor(Math.random() * cores.length)];

        confete.style.animationDuration =
        (Math.random() * 3 + 2) + "s";

        confete.style.width =
        (Math.random() * 10 + 6) + "px";

        confete.style.height =
        confete.style.width;

        document.body.appendChild(confete);

        setTimeout(()=>{
            confete.remove();
        },5000);
    }

}

</script>

</body>
</html>
